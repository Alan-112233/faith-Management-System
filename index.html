<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FB">
<title>斐石储能 · 客户管理系统</title>
<script src="supabase.min.js"></script>
<style>
:root{
  --bg:#F2F5FB;
  --bg-2:#EAEFF8;
  --surface:#FFFFFF;
  --surface-2:#F7FAFF;
  --ink:#16284C;
  --ink-2:#3B4E77;
  --muted:#64748F;
  --faint:#94A3B8;
  --brand:#2563EB;
  --brand-2:#1D4ED8;
  --brand-soft:#E8F1FE;
  --accent:#0EA5E9;
  --accent-soft:#E6F4FE;
  --danger:#EF4444;
  --danger-soft:#FDE9E9;
  --line:#DCE5F2;
  --line-2:#E9EFF8;
  --ok:#2563EB;
  --shadow:0 1px 2px rgba(16,40,80,.06),0 12px 28px -12px rgba(37,99,235,.16);
  --shadow-lg:0 2px 8px rgba(16,40,80,.08),0 24px 48px -18px rgba(37,99,235,.26);
  --r:16px;
  --r-sm:12px;
  --ease:cubic-bezier(.25,1,.5,1);
  --t-1:120ms ease;
  --t-2:220ms var(--ease);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  background:
    radial-gradient(1000px 480px at 88% -8%, rgba(37,99,235,.05), transparent 60%),
    radial-gradient(900px 440px at 6% 108%, rgba(14,165,233,.06), transparent 60%),
    #F2F5FB;
  background-attachment:fixed;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;width:100%;transition:border-color var(--t-1)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
.label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 5px;font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* ===== 登录 ===== */
#vLogin{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
    radial-gradient(120% 80% at 100% 0%, #DBEAFE 0%, transparent 55%),
    radial-gradient(120% 90% at 0% 100%, #E6F0FF 0%, #EAF2FC 100%);
  color:#16284C;overflow:auto;
}
.login-card{width:100%;max-width:400px;padding:12px;margin:auto}
.brand-symbol{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.symbol{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -6px rgba(37,99,235,.55)}
.brand-symbol h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:700}
.brand-symbol p{margin:2px 0 0;font-size:12px;color:#7B90B8}
.login-panel{background:rgba(255,255,255,.97);color:var(--ink);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow-lg)}
.login-panel h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.login-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px}
.field{margin-bottom:14px}
.pw-field{position:relative}
.pw-field input{padding-right:44px;letter-spacing:1px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.primary-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand-2);color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:14px;box-shadow:0 10px 22px -8px rgba(37,99,235,.5);transition:transform var(--t-1),background var(--t-1)}
.primary-btn:active{transform:scale(.985)}
.primary-btn[disabled]{opacity:.6;box-shadow:none}
.login-hint{margin-top:16px;font-size:11.5px;color:var(--faint);line-height:1.6}
.err{border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;padding:9px 12px;margin:0 0 12px;display:none}
.err.show{display:block}

/* ===== 应用外壳 ===== */
#vApp{display:none;height:100dvh;max-height:100vh;flex-direction:column;background:var(--bg)}
#vApp.on{display:flex}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,242,234,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.topbar .t-title{font-size:17px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;min-width:0}
.topbar .t-sub{font-size:12px;color:var(--muted);font-weight:500}
.search-wrap{flex:1;position:relative;max-width:520px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-wrap input{padding-left:38px;border-radius:12px;background:var(--surface);font-size:14px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow)}
.icon-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}

.scroll{flex:1;overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 96px);scrollbar-width:thin}
.panel{max-width:860px;margin:0 auto}

/* 区域瓷砖 */
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.r-tile{position:relative;overflow:hidden;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:15px 15px 13px;box-shadow:var(--shadow);text-align:left;transition:transform var(--t-2),box-shadow var(--t-2)}
.r-tile:active{transform:scale(.98)}
.r-tile .r-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px;background:var(--brand-soft);color:var(--brand)}
.r-tile .r-name{font-size:15.5px;font-weight:750;color:var(--ink)}
.r-tile .r-meta{margin-top:2px;font-size:12px;color:var(--muted)}
.r-tile .r-count{position:absolute;top:13px;right:14px;font-size:22px;font-weight:800;color:var(--line);line-height:1}
.r-tile .r-next{position:absolute;right:14px;bottom:13px;font-size:16px;color:var(--faint)}
.r-tile[data-big] .r-ico{background:var(--accent-soft);color:var(--accent)}
.r-tile[data-big] .r-count{color:var(--accent-soft)}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.section-title h3{margin:0;font-size:13.5px;font-weight:750;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase}
.section-title .more{font-size:12.5px;color:var(--brand);font-weight:600}

/* 客户卡片 */
.c-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform var(--t-2)}
.c-card:active{transform:scale(.985)}
.avatar{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:750;color:#fff;background:var(--brand-2)}
.c-main{flex:1;min-width:0}
.c-name{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;font-weight:650;padding:2.5px 8px;border-radius:20px;background:var(--bg-2);color:var(--ink-2)}
.tag.t-green{background:var(--brand-soft);color:var(--brand)}
.tag.t-amber{background:var(--accent-soft);color:var(--accent)}
.tag.t-line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.c-meta{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;flex-direction:column;gap:3px}
.c-meta b{color:var(--ink-2);font-weight:650}
.c-meta .row{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta .row svg{flex:none;color:var(--faint)}
.c-chev{flex:none;color:var(--faint);font-size:16px;margin-top:4px}

/* 筛选条 */
.filter-bar{position:sticky;top:64px;z-index:15;background:var(--bg);padding:8px 0 6px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
.filter-bar::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:650;padding:7px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:all var(--t-1);white-space:nowrap}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.count-pill{margin-left:4px;font-size:11px;opacity:.8;font-weight:650}

/* 空状态 */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .e-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:var(--bg-2);display:grid;place-items:center;color:var(--faint)}

/* 详情 */
.d-hero{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(150deg,#1E40AF,#2563EB 70%);color:#fff;padding:20px 18px 30px;margin-bottom:-16px}
.d-hero .back{display:inline-flex;align-items:center;gap:6px;color:#D6E4FF;font-size:13px;margin-bottom:18px;padding:4px 8px 4px 0;border-radius:8px}
.d-hero h2{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.3;padding-right:8px;word-break:break-all}
.d-hero .d-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:#DCE8FF}
.d-hero .d-badge{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:20px;font-weight:650}
.d-brief{margin:24px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px}
.kv .k{font-size:11.5px;color:var(--muted);font-weight:650;letter-spacing:.3px}
.kv .v{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:2px;word-break:break-all}
.kv .v.small{font-size:13px;font-weight:600}
.kv.quote{grid-column:1/-1;background:var(--accent-soft);border-color:#EBDDB7}
.kv.quote .v{color:var(--accent);font-size:16px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.block-head h4{margin:0;font-size:14px;font-weight:750;color:var(--ink-2)}
.icon-act{font-size:12px;color:var(--brand);font-weight:650;display:inline-flex;align-items:center;gap:5px}
.long-text{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-all;line-height:1.7;max-height:220px;overflow:auto}
.copybtn{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:8px;margin-left:8px}
.contact-list{display:flex;flex-direction:column;gap:10px}
.contact-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line-2)}
.contact-row:last-child{border-bottom:none}
.contact-row .l{font-size:13.5px;font-weight:650;color:var(--ink-2)}
.contact-row .r{font-size:13px;color:var(--brand);font-weight:700;letter-spacing:.3px}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-18px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-2);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--brand-2)}
.tl-item.new::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tl-date{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:3px}
.tl-date.new{color:var(--accent)}
.tl-text{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.q-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.q-row:last-child{border-bottom:none}
.q-left{min-width:0}
.q-date{font-size:12px;color:var(--muted)}
.q-model{font-size:13.5px;font-weight:700;color:var(--ink)}
.q-sub{font-size:12px;color:var(--muted)}
.q-price{font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap}
.q-price .usd{font-size:12px;color:var(--muted);font-weight:600}

/* 表单 */
.form{padding-bottom:8px}
.form-row{margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid .two{grid-column:1/-1}
.field-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.ghost-btn{flex:1;font-size:14px;font-weight:650;padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.danger-btn{flex:1;font-size:14px;font-weight:650;padding:13px;border-radius:14px;background:var(--danger-soft);border:1px solid transparent;color:var(--danger)}
.save-btn{flex:1.4;font-size:14px;font-weight:700;padding:13px;border-radius:14px;background:var(--brand-2);color:#fff}
.sec-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.sec-row:last-child{border-bottom:none}
.sec-ico{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center}
.sec-row .t{flex:1}
.sec-row .t b{display:block;font-size:14px;color:var(--ink)}
.sec-row .t span{font-size:12.5px;color:var(--muted)}
.sec-row .role{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.role.admin{background:var(--accent-soft);color:var(--accent)}
.role.editor{background:var(--brand-soft);color:var(--brand)}
.role.viewer{background:var(--bg-2);color:var(--ink-2)}

/* 底部导航 */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(8px,env(safe-area-inset-left));display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:650;padding:6px 2px;border-radius:12px;position:relative}
.nav-item svg{width:22px;height:22px}
.nav-item.on{color:var(--brand)}
.nav-item .dot{position:absolute;top:4px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:29;width:54px;height:54px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(15,81,50,.6);font-size:26px;animation:rise .4s var(--ease)}
/* 浮动操作项 */
.fab-menu{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:29;display:flex;flex-direction:column;gap:10px;align-items:flex-end;animation:rise .3s var(--ease)}
.fab-item{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:10px 14px;border-radius:13px;font-size:13.5px;font-weight:700;color:var(--ink)}
.dim{display:none;position:fixed;inset:0;z-index:28;background:rgba(15,22,18,.35)}
.dim.on{display:block}

/* 统计 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-.5px}
.stat .t{font-size:12px;color:var(--muted);margin-top:2px}
.stat.r1 .n{color:var(--brand)}
.stat.r2 .n{color:var(--accent)}
.region-bar{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.region-bar .b-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.region-bar .b-row .n{flex:none;width:56px;color:var(--ink-2);font-weight:650}
.region-bar .track{flex:1;height:9px;background:var(--bg-2);border-radius:20px;overflow:hidden}
.region-bar .fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.region-bar .fill.amber{background:linear-gradient(90deg,#B4772B,var(--accent))}
.region-bar .b-row .pct{flex:none;width:34px;text-align:right;color:var(--muted);font-weight:650}

/* 列表 tab */
.view-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.view-head h2{margin:0;font-size:18px;font-weight:800;flex:1}
.view-head .sub{font-size:12.5px;color:var(--muted)}

/* toast */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%) translateY(-8px);z-index:80;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity var(--t-2),transform var(--t-2);max-width:88%;text-align:center;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s var(--ease) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (pointer:fine){
  .c-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .r-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .primary-btn:hover{background:#1747C9}
}
@media(min-width:640px){.region-grid{grid-template-columns:repeat(3,1fr)}.d-brief{grid-template-columns:1fr 1fr 1fr}.form-grid .two{grid-column:auto}}
@media(min-width:768px){.brand-symbol h1{font-size:22px}.login-panel h2{font-size:20px}.region-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1024px){
  body{font-size:15px}
  .panel{padding-top:8px}
  .d-brief{grid-template-columns:repeat(4,1fr)}
}
.hidden{display:none!important}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.mt6{margin-top:6px}.mt12{margin-top:12px}.mt20{margin-top:20px}
</style>
</head>
<body>

<!-- 登录 -->
<div id="vLogin">
  <div class="login-card">
    <div class="brand-symbol rise">
      <div class="symbol">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <div>
        <h1>斐石储能</h1>
        <p>客户管理系统</p>
      </div>
    </div>
    <div class="login-panel rise" style="animation-delay:.06s">
      <h2>欢迎回来</h2>
      <p class="login-sub">登录以查看与维护客户资料</p>
      <div class="err" id="loginErr"></div>
      <div class="field">
        <label class="label">邮箱</label>
        <input id="loginUser" autocomplete="username" placeholder="请输入登录邮箱">
      </div>
      <div class="field">
        <label class="label">密码</label>
        <div class="pw-field">
          <input id="loginPw" type="password" autocomplete="current-password" placeholder="请输入密码">
          <button type="button" class="eye" onclick="togglePw('loginPw',this)" aria-label="显示密码">👁</button>
        </div>
      </div>
      <button class="primary-btn" id="loginBtn" onclick="doLogin()">
        <span>登 录</span>

<script>
/* ================= 加密 / 存储 ================= */
var LS='clm_store_v3';
var SECRET_VERSION=1;
var DEFAULTPW='admin123';
var te=new TextEncoder(), td=new TextDecoder();
function toB64(u8){var s='',C=0x8000;for(var i=0;i<u8.length;i+=C){s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));}return btoa(s);}
function fromB64(b){var bin=atob(b),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8;}
function rand(n){return crypto.getRandomValues(new Uint8Array(n));}
async function deriveKey(pw,saltB,iter){var k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:saltB,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function importAES(bytes){return await crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt']);}
async function encBytes(key,bytes){var iv=rand(12);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes);return {iv:iv,ct:new Uint8Array(ct)};}
async function decBytes(key,ivB,ctB){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ivB},key,ctB);return new Uint8Array(pt);}

var SUPABASE_ANON='sb_publishable_10PzA2_ipYo_4jT9a6-hlA_RbCdhfPn';  // <-- 你的 Supabase anon public key

function sbclip(){
  if(sb)return sb;
  if(!window.supabase||!window.supabase.createClient)throw new Error('supabase-js 未加载，请检查网络');
  if(!SUPABASE_URL||!SUPABASE_ANON)throw new Error('请在本文件顶部填入 SUPABASE_URL / SUPABASE_ANON');
  return sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
}
function toRow(o){return {name:o&&o.name||'',category:o&&o.category||'',region:o&&o.region||'',target_product:o&&o.targetProduct||'',market:o&&o.market||'',contact:o&&o.contact||'',phone:o&&o.phone||'',address:o&&o.address||'',liaison:o&&o.liaison||'',status:o&&o.status||'',company_info:o&&o.companyInfo||'',note:o&&o.note||''};}
async function loadAll(){
  var sbc=sbclip();
  var {data:{user}}=await sbc.auth.getUser();if(!user)return;
  var myRole='viewer';
  var {data:profs,error:pe}=await sbc.from('profiles').select('id,email,role');
  if(!pe&&profs){
    accounts=profs.filter(function(p){return p.id!==user.id;});
    profs.forEach(function(p){if(p.id===user.id)myRole=p.role;});
  }
  cur={user:{u:user.email||'',role:myRole},id:user.id};
  var {data:cs}=await sbc.from('clients').select('*');
  var {data:fs}=await sbc.from('followups').select('*');
  var {data:qs}=await sbc.from('quotes').select('*');
  clients=(cs||[]).map(function(r){return {id:r.id,name:r.name,category:r.category||'',region:r.region||'',targetProduct:r.target_product||'',market:r.market||'',contact:r.contact||'',phone:r.phone||'',address:r.address||'',liaison:r.liaison||'',status:r.status||'',companyInfo:r.company_info||'',note:r.note||'',tags:r.tags||[],followup:[],quotes:[],latestQuote:''};});
  var cm={};clients.forEach(function(c){cm[c.id]=c;});
  (qs||[]).forEach(function(x){var c=cm[x.client_id];if(c)c.quotes.push({date:x.date||'',name:x.name||'',qty:x.qty||'',priceCny:x.price_cny||'',priceUsd:x.price_usd||'',retail:x.retail||''});});
  (fs||[]).forEach(function(x){var c=cm[x.client_id];if(c)c.followup.push({date:x.date||'',text:x.text||''});});
  clients.forEach(function(c){
    if(c.quotes&&c.quotes.length){var last=c.quotes[c.quotes.length-1];c.latestQuote=[last.name,last.qty,last.priceCny&&('¥'+last.priceCny),last.priceUsd&&('$'+last.priceUsd)].filter(Boolean).join(' ');}
  });
  clients.sort(function(a,b){return (a.id||'')<(b.id||'')?-1:1;});
}
function subscribe(sbc){
  sbc.channel('crm-db')
    .on('postgres_changes',{event:'*',schema:'public',table:'clients'},function(){onRemote();})
    .on('postgres_changes',{event:'*',schema:'public',table:'followups'},function(){onRemote();})
    .on('postgres_changes',{event:'*',schema:'public',table:'quotes'},function(){onRemote();})
    .subscribe();
}
function onRemote(){
  loadAll().then(function(){ if(cur&&view&&view.name!=='edit')render(); }).catch(function(){});
}
async function changeRole(id,role){
  if(!isAdmin())return toast('仅管理员可操作');
  var {error}=await sb.from('profiles').update({role:role}).eq('id',id);
  if(error)return toast('设置失败：'+(error.message||''));
  accounts.forEach(function(a){if(a.id===id)a.role=role;});
  toast('已更新角色');render();
}

function loadStore(){
  try{var raw=localStorage.getItem(LS);if(raw){store=JSON.parse(raw);return true;}}catch(e){}
  return false;
}
function saveStore(){localStorage.setItem(LS,JSON.stringify(store));}
function wipeStore(){localStorage.removeItem(LS);}

/* 首次初始化：生成数据密钥，用默认管理员口令包裹，加密 seed 数据 */
async function bootstrap(){
  var dataKey=rand(32);
  var seed=JSON.parse(document.getElementById('seed').textContent);
  var dk=await importAES(dataKey);
  var de=await encBytes(dk,te.encode(JSON.stringify(seed)));
  var salt=rand(16),iter=120000;
  var pk=await deriveKey(DEFAULTPW,salt,iter);
  var wr=await encBytes(pk,dataKey);
  store={
    version:SECRET_VERSION,
    keystore:[{u:'admin',role:'admin',salt:toB64(salt),iter:iter,iv:toB64(wr.iv),enc:toB64(wr.ct),created:Date.now(),pwDefault:true}],
    data:{iv:toB64(de.iv),ct:toB64(de.ct)}
  };
  saveStore();
}

/* 登录 */
async function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var pw=document.getElementById('loginPw').value;
  var err=document.getElementById('loginErr');
  err.classList.remove('show');
  if(!u||!pw){err.textContent='请输入邮箱和密码';err.classList.add('show');return;}
  var btn=document.getElementById('loginBtn');btn.disabled=true;btn.querySelector('span').textContent='登录中…';
  try{
    var sbc=sbclip();
    var {data,error}=await sbc.auth.signInWithPassword({email:u,password:pw});
    if(error)throw new Error(error.message||'登录失败');
    await loadAll();
    subscribe(sbc);
    enterApp();
  }catch(e){
    err.textContent=(e&&e.message)||'登录失败';err.classList.add('show');
  }finally{
    btn.disabled=false;btn.querySelector('span').textContent='登 录';
  }
}

function saveSession(){

}
function clearSession(){ try{ sessionStorage.removeItem('clm_sess'); }catch(_){} }
function loadSession(){ try{ return JSON.parse(sessionStorage.getItem('clm_sess')); }catch(_){ return null; } }
function enterApp(){
  document.getElementById('vLogin').style.display='none';
  document.getElementById('vApp').classList.add('on');
  render();
}
async function logout(){
  if(!confirm('确定退出登录？'))return;
  try{await sb.auth.signOut();}catch(e){}
  cur=null;clients=[];accounts=[];
  view={name:'home',region:'全部',cat:'全部',q:''};
  document.getElementById('vLogin').style.display='flex';document.getElementById('vApp').classList.remove('on');document.getElementById('loginPw').value='';
}

function canWrite(){return cur&&cur.user.role!=='viewer';}
function isAdmin(){return cur&&cur.user.role==='admin';}

/* ================= 数据写操作（写入 Supabase，云端共享）================= */
async function createClient(obj){
  if(!canWrite())return toast('无修改权限');
  var {error}=await sb.from('clients').insert(Object.assign({id:'c'+Date.now()},toRow(obj)));
  if(error)return toast('保存失败：'+(error.message||''));
  await loadAll();render();toast('已新增客户');
}
async function updateClient(id,obj){
  if(!canWrite())return toast('无修改权限');
  var {error}=await sb.from('clients').update(toRow(obj)).eq('id',id);
  if(error)return toast('保存失败：'+(error.message||''));
  await loadAll();render();toast('已保存');
}
async function deleteClient(id){
  if(!canWrite())return toast('无修改权限');
  if(!confirm('确定删除该客户？此操作不可恢复。'))return;
  var {error}=await sb.from('clients').delete().eq('id',id);
  if(error)return toast('删除失败：'+(error.message||''));
  view.name='list';await loadAll();render();toast('已删除');
}
async function addFollowup(id,date,text){
  if(!canWrite())return toast('无修改权限');
  var {error}=await sb.from('followups').insert({client_id:id,date:date,text:text});
  if(error)return toast('添加失败：'+(error.message||''));
  await loadAll();render();
}
async function addQuote(id,q){
  if(!canWrite())return toast('无修改权限');
  var {error}=await sb.from('quotes').insert({client_id:id,date:q.date||'',name:q.name||'',qty:q.qty||'',price_cny:q.priceCny||'',price_usd:q.priceUsd||'',retail:q.retail||''});
  if(error)return toast('添加失败：'+(error.message||''));
  await loadAll();render();
}

/* 账号管理（云端版：新账号在 Supabase 后台创建，此处管理角色与改密） */
async function addAccount(u,pw,role){ toast('新账号请在 Supabase 后台创建（Authentication → Add user，邮箱+密码），创建后自动以“查看”权限加入，再到下方调整权限。'); }
async function deleteAccount(u){ toast('请到 Supabase 后台移除用户：Authentication → Users'); }
async function changePassword(op,np){
  if(!cur)return;
  if(!np)return toast('请输入新密码');
  var {data,error}=await sb.auth.updateUser({password:np});
  if(error)return toast((error&&error.message)||'修改失败');
  toast('密码已修改');
}

/* ================= UI 工具 ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function toast(m,c){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}
function fmtDate(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';}

var REGIONS=[['国内','◎'],['非洲','🦁'],['亚洲/大洋洲','🌏'],['美洲','🌎'],['欧洲','🌍']];
function regionMeta(r){for(var i=0;i<REGIONS.length;i++)if(REGIONS[i][0]===r)return REGIONS[i];return [r,'🏷'];}
function catStyle(c){if(c==='已入库·跟进中'||c.indexOf('跟进')>-1)return 't-green';if(c==='海外渠道')return 't-amber';return 't-line';}
function tagsOf(c){return c.tags&&c.tags.length?c.tags:[c.category].filter(Boolean);}
function latestQuoteText(c){if(c.latestQuote)return c.latestQuote;var qs=c.quotes||[];if(!qs.length)return '';var last=qs[qs.length-1];return [last.name,last.qty,last.priceCny&&('¥'+last.priceCny),last.priceUsd&&('$'+last.priceUsd)].filter(Boolean).join(' ');}
function regionCount(r){return clients.filter(function(c){return c.region===r;}).length;}
/* 区域选项：五大区 + 未分类 + 客户中出现的自定义区域，动态生成 */
function regionOptions(){
  var defs=['国内','非洲','亚洲/大洋洲','美洲','欧洲','未分类'];
  var seen={},out=[];
  defs.forEach(function(d){seen[d]=1;out.push(d);});
  clients.forEach(function(c){if(c.region&&!seen[c.region]){seen[c.region]=1;out.push(c.region);}});
  return out;
}

/* 分类筛选项动态（报价客户不并列作为分类，改由统计页统计真实报价数） */
function catOptions(){
  var m={};
  clients.forEach(function(c){tagsOf(c).forEach(function(t){if(t!=='报价客户')m[t]=1;});});
  return Object.keys(m);
}
function catCount(cat){
  return clients.filter(function(c){return tagsOf(c).indexOf(cat)>-1;}).length;
}

/* ================= 渲染 ================= */
function render(){
  renderTopbar();
  var p=document.getElementById('panel');
  if(view.name==='home')p.innerHTML=renderHome();
  else if(view.name==='list')p.innerHTML=renderList();
  else if(view.name==='detail')p.innerHTML=renderDetail(view.detailId);
  else if(view.name==='edit')p.innerHTML=renderEdit(view.detailId);
  else if(view.name==='stat')p.innerHTML=renderStat();
  else if(view.name==='my')p.innerHTML=renderMy();
  renderBottom();
  document.getElementById('main').scrollTop=0;
}

function renderTopbar(){
  var t=document.getElementById('topbar');
  var isDetail=view.name==='detail';
  if(isDetail||view.name==='edit'){
    var title=view.name==='edit'?'编辑客户':(cu().name||'客户详情');
    t.innerHTML=topbar(title,true);
    return;
  }
  var title=(view.name==='home')?'区域概览':(view.name==='stat')?'数据统计':(view.name==='my')?'我的' :'全部客户';
  t.innerHTML=topbar(title,false);
}
function topbar(title,hasSearch){
  var sub=(view.name==='home')?'· '+clients.length+' 位客户' :(view.name==='list'?'· '+filtered().length+' 位':'');
  var search='';
  if(view.name==='list'){
    search='<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" value="'+esc(view.q)+'" placeholder="搜索客户/联系人/市场" oninput="searchInput(this.value)"></div>';
  }
  var right='';
  if(view.name==='home')right='<button class="icon-btn" onclick="goto(\'stat\')" aria-label="统计"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-6"/></svg></button>';
  right+='<button class="icon-btn" onclick="goto(\'my\')" aria-label="我的"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg></button>';
  return '<div class="t-title">'+title+'<span class="t-sub">'+sub+'</span></div>'+search+'<div class="top-actions">'+right+'</div>';
}
function cu(){if(view.detailId)return clients.find(function(c){return c.id===view.detailId;});return null;}

function renderHome(){
  var total=clients.length;
  var html='<section class="rise">';
  html+='<div class="section-title" style="margin-top:2px"><h3>客户分布</h3><button class="more" onclick="goto(\'list\')">全部客户 ›</button></div>';
  html+='<div class="region-grid" style="grid-template-columns:1fr 1fr">';
  var idx=0;
  regionOptions().forEach(function(rk){
    var n=regionCount(rk);
    if(n===0)return;
    var big=idx===0;
    html+='<button class="r-tile" '+(big?'data-big':'')+' onclick="openRegion(\''+rk+'\')">';
    html+='<div class="r-ico">'+regionMeta(rk)[1]+'</div>';
    html+='<div class="r-name">'+rk+'</div>';
    html+='<div class="r-meta">'+n+' 位客户</div>';
    html+='<div class="r-count num">'+n+'</div>';
    html+='<div class="r-next">›</div></button>';
    idx++;
  });
  html+='</div></section>';

  // 分类概览
  html+='<section class="rise" style="animation-delay:.05s"><div class="section-title"><h3>客户分类</h3></div>';
  html+='<div class="c-card" style="flex-direction:column;gap:4px">';
  catOptions().forEach(function(cat){
    var n=catCount(cat);
    html+='<div onclick="goto(&apos;list&apos;)" data-cat="'+esc(cat)+'" class="sec-row" style="width:100%;cursor:pointer"><span class="tag '+catStyle(cat)+'">'+esc(cat)+'</span><div class="t" style="flex:1"></div><b class="num" style="color:var(--ink-2)">'+n+'</b></div>';
  });
  html+='</div></section>';

  // 重点跟进
  html+='<section class="rise" style="animation-delay:.1s"><div class="section-title"><h3>活跃跟进</h3></div>';
  var act=clients.filter(function(c){return tagsOf(c).indexOf('已入库·跟进中')>-1;});
  act.forEach(function(c){
    var lp=latestQuoteText(c);
    html+=card(c,lp);
  });
  html+='</section>';
  return html;
}

function filtered(){
  var r=view.region,cat=view.cat,q=view.q.toLowerCase();
  return clients.filter(function(c){
    if(r!=='全部'&&c.region!==r)return false;
    if(cat!=='全部'&&tagsOf(c).indexOf(cat)<0)return false;
    if(q){var hay=(c.name+' '+c.contact+' '+c.phone+' '+c.market+' '+c.liaison+' '+c.targetProduct+' '+tagsOf(c).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}

function renderList(){
  var list=filtered();
  var html='';
  html+='<div class="filter-bar">';
  html+='<button class="chip'+(view.region==='全部'?' on':'')+'" onclick="setRegion(&apos;全部&apos;)">全部区域<span class="count-pill">'+clients.length+'</span></button>';
  regionOptions().forEach(function(rk){
    if(regionCount(rk)===0)return;
    html+='<button class="chip'+(view.region===rk?' on':'')+'" onclick="setRegion(&apos;'+rk+'&apos;)">'+rk+'<span class="count-pill">'+regionCount(rk)+'</span></button>';
  });
  html+='</div>';
  html+='<div class="filter-bar">';
  html+='<button class="chip'+(view.cat==='全部'?' on':'')+'" onclick="setCat(&apos;全部&apos;)">全部分类</button>';
  catOptions().forEach(function(cat){
    html+='<button class="chip'+(view.cat===cat?' on':'')+'" onclick="setCat(&apos;'+esc(cat)+'&apos;)">'+esc(cat)+'<span class="count-pill">'+catCount(cat)+'</span></button>';
  });
  html+='</div>';
  var title=view.region!=='全部'?view.region:(view.cat!=='全部'?view.cat:'全部客户');
  html+='<div class="view-head"><h2>'+title+'</h2><span class="sub num">'+list.length+' 位</span></div>';
  if(!list.length){
    html+='<div class="empty"><div class="e-ico">🔍</div><div>没有匹配的客户</div></div>';
  }else{
    list.forEach(function(c){html+=card(c,latestQuoteText(c));});
  }
  return html;
}
function card(c,lp){
  var avName=(c.name||'客').replace(/^[（(]|[）)]/g,'').slice(0,1);
  var tags=tagsOf(c);
  var contact=(c.contact||c.liaison||'');
  var p1=contact?'<div class="row"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg><b>'+esc(contact)+'</b>'+(c.phone?' · '+esc(c.phone):'')+'</div>':'';
  var p2=(c.market||c.targetProduct)?'<div class="row"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'+esc(c.market||c.targetProduct)+'</div>':'';
  var p3=lp?'<div class="row"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17v-6M7 17V9M11 17v-8M15 17v-4M19 17V5"/></svg><b>'+esc(lp)+'</b></div>':'';
  return '<button class="c-card" onclick="openClient(\''+c.id+'\')">'+
    '<div class="avatar">'+esc(avName)+'</div>'+
    '<div class="c-main">'+
      '<div class="c-name">'+esc(c.name)+'</div>'+
      '<div class="c-tags">'+tags.map(function(t){return '<span class="tag '+catStyle(t)+'">'+esc(t)+'</span>';}).join('')+'</div>'+
      '<div class="c-meta">'+p1+p2+p3+'</div>'+
    '</div>'+
    '<div class="c-chev">›</div>'+
    '</button>';
}

/* ===== 详情 ===== */
function renderDetail(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return '<div class="empty">客户不存在</div>';
  var tags=tagsOf(c);
  var quote=latestQuoteText(c);
  var write=canWrite();
  var f=c.followup||[],q=c.quotes||[];
  var html='<div class="rise">';
  html+='<div class="d-hero">';
  html+='<button class="back" onclick="goto(&apos;list&apos;)">‹ 返回</button>';
  html+='<h2>'+esc(c.name)+'</h2>';
  html+='<div class="d-sub">'+tags.map(function(t){return '<span class="d-badge">'+esc(t)+'</span>';}).join('')+(c.region?('<span class="d-badge">'+esc(c.region)+'</span>'):'')+'</div>';
  html+='</div>';

  html+='<div class="panel" style="max-width:860px">';
  html+='<div class="d-brief">';
  html+='<div class="kv"><div class="k">类别</div><div class="v small">'+esc(tags[0]||'-')+'</div></div>';
  html+='<div class="kv"><div class="k">对接人</div><div class="v small">'+esc(c.liaison||'-')+'</div></div>';
  html+='<div class="kv"><div class="k">目标市场</div><div class="v small">'+esc(c.market||'-')+'</div></div>';
  html+='<div class="kv"><div class="k">目标产品</div><div class="v small">'+esc(c.targetProduct||'-')+'</div></div>';
  if(quote)html+='<div class="kv quote"><div class="k">最新报价</div><div class="v">'+esc(quote)+'</div></div>';
  html+='</div>';

  html+='<div class="block"><div class="block-head"><h4>联系信息</h4></div><div class="contact-list">';
  html+='<div class="contact-row"><div class="l">联系人</div><div class="r" onclick="copyText(this)">'+esc(c.contact||'-')+'</div></div>';
  html+='<div class="contact-row"><div class="l">电话</div><div class="r" onclick="copyText(this)">'+esc(c.phone||'-')+'</div></div>';
  html+='<div class="contact-row"><div class="l">地址</div><div class="r" style="font-size:12.5px;font-weight:600;text-align:right;word-break:break-all" onclick="copyText(this)">'+esc(c.address||'-')+'</div></div>';
  html+='</div></div>';

  if(c.companyInfo){
    html+='<div class="block"><div class="block-head"><h4>企业信息</h4></div><div class="long-text">'+esc(c.companyInfo)+'</div></div>';
  }

  html+='<div class="block"><div class="block-head"><h4>跟进记录 <span class="muted num" style="font-size:12px;font-weight:500">'+f.length+' 条</span></h4>'+(write?'<button class="icon-act" onclick="promptFollow(\''+c.id+'\')">＋ 添加</button>':'')+'</div>';
  if(!f.length){html+='<p class="muted" style="font-size:13px;margin:2px 0">暂无跟进记录</p>';}
  else{
    html+='<div class="tl">';
    f.forEach(function(it){
      var isNew=(Date.now()-new Date(it.date.replace(/\./g,'-')).getTime())<30*24*3600*1000;
      html+='<div class="tl-item'+(isNew?' new':'')+'"><div class="tl-date'+(isNew?' new':'')+'">'+esc(it.date)+'</div><div class="tl-text">'+esc(it.text)+'</div></div>';
    });
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="block"><div class="block-head"><h4>报价记录 <span class="muted num" style="font-size:12px;font-weight:500">'+q.length+' 条</span></h4>'+(write?'<button class="icon-act" onclick="promptQuote(\''+c.id+'\')">＋ 添加</button>':'')+'</div>';
  if(!q.length){html+='<p class="muted" style="font-size:13px;margin:2px 0">暂无报价</p>';}
  else{
    q.forEach(function(x){
      var price=[x.priceCny&&('¥'+x.priceCny),x.priceUsd&&('$'+x.priceUsd)].filter(Boolean).join(' / ');
      html+='<div class="q-row"><div class="q-left"><div class="q-date">'+esc(x.date||'')+'</div><div class="q-model">'+esc(x.name||'')+'</div><div class="q-sub">'+esc(x.qty||'')+'</div></div><div class="q-price">'+esc(price)+'</div></div>';
    });
  }
  html+='</div>';

  if(write){
    html+='<div class="field-actions" style="margin-top:6px">';
    html+='<button class="save-btn" onclick="goto(\'edit\',\''+c.id+'\')">编辑客户</button>';
    html+='<button class="danger-btn" onclick="deleteClient(\''+c.id+'\')">删除</button>';
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function copyText(el){
  var t=el.textContent.trim();if(!t||t==='-')return;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('已复制');},function(){});}else toast('无法复制');
}

/* 弹层：添加跟进/报价 */
function promptFollow(id){
  var d=document.createElement('div');d.className='sheet-mask';d.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(15,22,18,.4);display:flex;align-items:flex-end;justify-content:center';
  var now=new Date();var ds=now.getFullYear()+'.'+(now.getMonth()+1)+'.'+now.getDate();
  d.innerHTML='<div class="sheet" style="background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(env(safe-area-inset-bottom)+18px);animation:rise .3s var(--ease)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:15px">添加跟进</b><button style="font-size:18px" onclick="this.closest(&apos;.sheet-mask&apos;).remove()">✕</button></div>'+
    '<label class="label">日期</label><input id="sfDate" value="'+ds+'">'+
    '<label class="label" style="margin-top:12px">跟进内容</label><textarea id="sfText" rows="3" placeholder="本次跟进的情况…" style="resize:vertical"></textarea>'+
    '<button class="primary-btn mt12" onclick="submitFollow(\''+id+'\')">保存</button></div>';
  document.body.appendChild(d);
}
async function submitFollow(id){
  var date=document.getElementById('sfDate').value.trim();
  var text=document.getElementById('sfText').value.trim();
  if(!date||!text)return toast('请填写日期与内容');
  await addFollowup(id,date,text);
  document.querySelector('.sheet-mask').remove();
  toast('已添加跟进');
}

function promptQuote(id){
  var d=document.createElement('div');d.className='sheet-mask';d.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(15,22,18,.4);display:flex;align-items:flex-end;justify-content:center';
  var now=new Date();var ds=now.getFullYear()+'.'+(now.getMonth()+1)+'.'+now.getDate();
  d.innerHTML='<div class="sheet" style="background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(env(safe-area-inset-bottom)+18px);animation:rise .3s var(--ease)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:15px">添加报价</b><button style="font-size:18px" onclick="this.closest(&apos;.sheet-mask&apos;).remove()">✕</button></div>'+
    '<div class="form-grid"><div class="full"><label class="label">日期</label><input id="sqDate" value="'+ds+'"></div>'+
    '<div class="full"><label class="label">产品型号</label><input id="sqName" placeholder="如 eCandlePro"></div>'+
    '<div><label class="label">数量</label><input id="sqQty" placeholder="如 500 / 样品"></div>'+
    '<div class="two" style="grid-template-columns:1fr 1fr;display:grid;gap:12px"><div><label class="label">RMB 单价</label><input id="sqCny" placeholder="如 780"></div><div><label class="label">USD 单价</label><input id="sqUsd" placeholder="如 110"></div></div></div>'+
    '<button class="primary-btn mt12" onclick="submitQuote(\''+id+'\')">保存报价</button></div>';
  document.body.appendChild(d);
}
async function submitQuote(id){
  var q={date:safeVal('sqDate'),name:safeVal('sqName'),qty:safeVal('sqQty'),priceCny:safeVal('sqCny'),priceUsd:safeVal('sqUsd')};
  if(!q.name&&!q.priceCny&&!q.priceUsd)return toast('请填写至少一项');
  await addQuote(id,q);
  document.querySelector('.sheet-mask').remove();
  toast('已添加报价');
}
function safeVal(id){var e=document.getElementById(id);return e?e.value.trim():'';}

/* ===== 编辑 ===== */
function renderEdit(id){
  var c=id?clients.find(function(x){return x.id===id;}):{};
  var isNew=!id;
  if(!canWrite())return renderDetail(id||view.detailId);
  var fields=[
    ['name','客户名称',c&&c.name||'',1],
    ['category','类别',c&&c.category||'',0],
    ['region','区域',c&&c.region||'',0],
    ['market','目标市场',c&&c.market||'',0],
    ['targetProduct','目标产品',c&&c.targetProduct||'',0],
    ['contact','联系人',c&&c.contact||'',0],
    ['phone','电话',c&&c.phone||'',0],
    ['address','地址',c&&c.address||'',0],
    ['liaison','对接人',c&&c.liaison||'',0],
    ['companyInfo','企业信息',c&&c.companyInfo||'',1]
  ];
  var regionOpts=regionOptions();
  var catOpts=['已入库·跟进中','不活跃/潜在','海外渠道','已发货','报价客户'];
  var html='<div class="rise form">';
  html+='<div class="view-head"><button class="ghost-btn" style="flex:none;padding:9px 14px" onclick="'+(id?'goto(\'detail\',\''+id+'\')':'goto(\'list\')')+'">‹ 取消</button><h2>'+((isNew?'新增':'编辑')+'客户')+'</h2></div>';
  fields.forEach(function(f){
    var key=f[0],label=f[1],val=f[2],big=f[3];
    html+='<div class="form-row '+(big?'':'form-col')+'">';
    html+='<label class="label">'+label+(key==='name'?' *':'')+'</label>';
    if(key==='region'){
      var customSel=!!val&&regionOpts.indexOf(val)<0;
      html+='<select id="e_region" onchange="regionCustom(this.value)"><option></option>';
      regionOpts.forEach(function(o){html+='<option'+(val===o?' selected':'')+'>'+o+'</option>';});
      html+='<option value="__custom__"'+(customSel?' selected':'')+'>＋ 自定义区域…</option>';
      html+='</select>';
      html+='<input id="e_region_custom" value="'+esc(val&&customSel?val:'')+'" placeholder="输入新区域名称，例如：中东/大洋洲…" style="margin-top:8px;display:'+(customSel?'block':'none')+'">';
    }else if(key==='category'){
      html+='<select id="e_'+key+'"><option></option>'+catOpts.map(function(o){return '<option'+(val===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
    }else if(big){
      html+='<textarea id="e_'+key+'" rows="'+(key==='companyInfo'?5:2)+'" placeholder="'+label+'">'+esc(val)+'</textarea>';
    }else{
      html+='<input id="e_'+key+'" value="'+esc(val)+'" placeholder="'+label+'">';
    }
    html+='</div>';
  });
  html+='<div class="field-actions"><button class="save-btn" onclick="saveEdit(\''+(id||'')+'\')">保存</button>'+(isNew?'':'<button class="danger-btn" onclick="deleteClient(\''+id+'\')">删除</button>')+'</div>';
  html+='</div>';
  return html;
}
async function saveEdit(id){
  if(!canWrite())return;
  var o={};
  ['name','category','market','targetProduct','contact','phone','address','liaison','companyInfo'].forEach(function(k){o[k]=safeVal('e_'+k);});
  var rv=safeVal('e_region');
  o.region=(rv==='__custom__'?safeVal('e_region_custom').trim():rv).trim();
  if(!o.name)return toast('客户名称不能为空');
  if(!o.region&&o.market)o.region=guessRegion(o.market);
  if(id){await updateClient(id,o);toast('已保存');goto('detail',id);}
  else{await createClient(o);view={name:'list',region:'全部',cat:'全部',q:''};render();toast('已新增客户');}
}
function guessRegion(m){var AM=['南非','安哥拉','科特迪瓦','赞比亚','肯尼亚','坦桑尼亚','加纳','刚果','尼日利亚','塞内加尔','马里','津巴布韦','非洲'],AMR=['美国','秘鲁','墨西哥','加拿大','古巴','巴西','南美','拉美','美洲','北美','智利'],EU=['德国','法国','英国','欧洲','斯洛伐克','欧盟'],AS=['巴基斯坦','印度','越南','菲律宾','印尼','新加坡','马来西亚','伊朗','伊拉克','中亚','俄罗斯','乌克兰','中东','阿联酋','沙特','巴布亚','澳大利亚','亚洲'];for(var i=0;i<AM.length;i++)if(m.indexOf(AM[i])>-1)return '非洲';for(i=0;i<AMR.length;i++)if(m.indexOf(AMR[i])>-1)return '美洲';for(i=0;i<EU.length;i++)if(m.indexOf(EU[i])>-1)return '欧洲';for(i=0;i<AS.length;i++)if(m.indexOf(AS[i])>-1)return '亚洲/大洋洲';return '国内';}
/* 区域下拉：选择"自定义区域"时展开文本输入框 */
function regionCustom(v){
  var box=document.getElementById('e_region_custom');
  if(box)box.style.display=(v==='__custom__')?'block':'none';
}

/* ===== 统计 ===== */
function renderStat(){
  var total=clients.length;
  var act=clients.filter(function(c){return tagsOf(c).indexOf('已入库·跟进中')>-1;}).length;
  var ship=clients.filter(function(c){return tagsOf(c).indexOf('已发货')>-1;}).length;
  var quote=clients.filter(function(c){return (c.quotes||[]).length;}).length;
  var html='<div class="rise"><div class="view-head"><h2>数据统计</h2></div>';
  html+='<div class="stat-grid">';
  html+='<div class="stat r1"><div class="n num">'+total+'</div><div class="t">客户总数</div></div>';
  html+='<div class="stat r1"><div class="n num">'+act+'</div><div class="t">活跃跟进中</div></div>';
  html+='<div class="stat r1"><div class="n num">'+quote+'</div><div class="t">有报价记录</div></div>';
  html+='<div class="stat r2"><div class="n num">'+ship+'</div><div class="t">已发货</div></div>';
  html+='</div>';
  html+='<div class="block mt12"><div class="block-head"><h4>区域分布</h4></div><div class="region-bar">';
  var max=1;REGIONS.forEach(function(rg){var n=regionCount(rg[0]);if(n>max)max=n;});
  REGIONS.forEach(function(rg,i){
    var n=regionCount(rg[0]);if(n===0)return;
    var pct=Math.round(n/total*100);
    html+='<div class="b-row"><span class="n">'+rg[0]+'</span><div class="track"><div class="fill'+(i===0?'':' amber')+'" style="width:'+Math.max(6,n/max*100)+'%"></div></div><span class="pct num">'+pct+'%</span></div>';
  });
  html+='</div></div>';
  html+='</div>';
  return html;
}

function roleName(r){return r==='admin'?'管理员':(r==='editor'?'修改权限':'查看权限');}
function acctListHtml(){
  if(!accounts.length)return '<p class="muted" style="font-size:12.5px;margin:4px 0">暂无其他成员账号</p>';
  var html='';
  accounts.forEach(function(e){
    var isSelf=cur&&cur.id===e.id;
    var sel='<select style="position:static;flex:none;width:auto;padding:7px 8px;font-size:12.5px" onchange="changeRole(&apos;'+e.id+'&apos;,this.value)">'
      +'<option value="viewer"'+(e.role==='viewer'?' selected':'')+'>查看权限</option>'
      +'<option value="editor"'+(e.role==='editor'?' selected':'')+'>修改权限</option>'
      +'<option value="admin"'+(e.role==='admin'?' selected':'')+'>管理员</option></select>';
    html+='<div class="sec-row"><div class="t" style="flex:1"><b>'+esc(e.email||e.id)+'</b><span>'+roleName(e.role)+(isSelf?'（我）':'')+'</span></div>'+sel+'</div>';
  });
  return html;
}
function showPwForm(){
  var h=document.getElementById('pwForm');
  if(h.innerHTML){h.innerHTML='';return;}
  h.innerHTML='<div class="form-grid mt12"><div><label class="label">旧密码</label><input type="password" id="po"></div><div><label class="label">新密码</label><input type="password" id="pn"></div><div><label class="label">确认新密码</label><input type="password" id="pc"></div><button class="save-btn" style="grid-column:1/-1" onclick="doChangePw()">确认修改</button></div>';
}
async function doChangePw(){
  var o=document.getElementById('po').value,n=document.getElementById('pn').value,c=document.getElementById('pc').value;
  if(!o||!n)return toast('请填写完整');
  if(n.length<5)return toast('新密码至少 5 位');
  if(n!==c)return toast('两次新密码不一致');
  await changePassword(o,n);
  var h=document.getElementById('pwForm');if(h)h.innerHTML='';
  document.querySelectorAll('#pwForm input').forEach(function(i){i.value='';});
  toast('密码已修改');
}

/* ===== 底部导航 ===== */
function renderBottom(){
  var wrap=document.querySelector('.bottombar');
  if(!wrap){
    wrap=document.createElement('nav');wrap.className='bottombar';wrap.id='bottombar';
    document.getElementById('vApp').appendChild(wrap);
  }
  var base=view.name==='detail'||view.name==='edit'?'list':'';
  var items=[
    ['home','区域','home',homeIco,view.name==='home'],
    ['list','客户','list',listIco,view.name==='list'||view.name==='detail'||view.name==='edit'],
    ['stat','统计','stat',statIco,view.name==='stat'],
    ['my','我的','my',myIco,view.name==='my']
  ];
  wrap.innerHTML=items.map(function(it){
    return '<button class="nav-item'+(it[4]?' on':'')+'" onclick="goto(\''+it[2]+'\')">'+it[3]+'<span>'+(it[1]==='客户'?'客户':it[1])+'</span></button>';
  }).join('');
  // FAB 权限与显示
  var fab=document.getElementById('fab'),dim=document.getElementById('dim'),fm=document.getElementById('fabMenu');
  fabOpen=false;fm.classList.add('hidden');dim.classList.remove('on');
  if(canWrite()&&(view.name==='list'||view.name==='home')){
    fab.classList.remove('hidden');
    fm.innerHTML='<button class="fab-item" onclick="newClient()">＋ 新增客户</button>';
  }else{fab.classList.add('hidden');}
}
function toggleFab(){
  var fm=document.getElementById('fabMenu'),dim=document.getElementById('dim');
  fabOpen=!fabOpen;
  fm.classList.toggle('hidden',!fabOpen);dim.classList.toggle('on',fabOpen);
}
function closeFab(){toggleFab();}
function newClient(){view={name:'edit',detailId:null};closeFab();render();}

/* ===== 导航（直接渲染切换 + 浏览器前进/后退）===== */
var _push=false;
function hist(){
  var s=Object.assign({},view);
  try{ if(_push)history.pushState({v:s},''); else history.replaceState({v:s},''); }catch(e){}
  _push=false;
}
window.addEventListener('popstate',function(e){
  if(e.state&&e.state.v&&cur){ try{view=e.state.v;render();}catch(_){} }
});
function goto(name,param){
  view={name:name,region:'全部',cat:'全部',q:''};
  if(name==='list'&&param)view.region=decodeURIComponent(param);
  if(name==='detail'&&param)view.detailId=param;
  if(name==='edit'&&param)view.detailId=param;
  _push=true;render();hist();
}
function openClient(id){view={name:'detail',detailId:id};_push=true;render();hist();}
function openRegion(r){view={name:'list',region:r,cat:'全部',q:''};_push=true;render();hist();}
function setRegion(r){view.region=r;_push=false;render();hist();}
function setCat(c){view.cat=c;_push=false;render();hist();}
function searchInput(v){view.q=v;document.getElementById('panel').innerHTML=renderList();renderBottom();_push=false;hist();}
function gotoDetail(name,param){goto(name,decodeURIComponent(param||''));}

/* ===== 初始化：恢复 Supabase 会话 ===== */
async function init(){
  try{
    var sbc=sbclip();
    var {data:{user}}=await sbc.auth.getUser();
    if(user){
      await loadAll();
      subscribe(sbc);
      enterApp();
      return;
    }
  }catch(e){ console.warn('init',e); }
  document.getElementById('vLogin').style.display='flex';
  document.getElementById('vApp').classList.remove('on');
  var li=document.getElementById('loginUser');
  li.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginPw').focus();});
  document.getElementById('loginPw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}
init();
